
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国旗と国名クイズ｜まなびやつばめ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: #263044;
      background:
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.75) 0 36px, transparent 38px),
        radial-gradient(circle at 90% 18%, rgba(255,255,255,.65) 0 48px, transparent 50px),
        radial-gradient(circle at 16% 88%, rgba(255,255,255,.65) 0 58px, transparent 60px),
        linear-gradient(135deg, #fff7c2 0%, #b8f7ff 45%, #ffd6ef 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .7;
      background-image:
        radial-gradient(circle, rgba(255,193,7,.32) 0 4px, transparent 5px),
        radial-gradient(circle, rgba(25,118,210,.22) 0 4px, transparent 5px),
        radial-gradient(circle, rgba(255,92,138,.22) 0 4px, transparent 5px);
      background-size: 72px 72px, 98px 98px, 128px 128px;
      background-position: 0 0, 35px 40px, 12px 70px;
    }

    button {
      font-family: inherit;
    }

    button:disabled {
      cursor: default;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      width: min(1080px, 96vw);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px 0 22px;
      text-align: center;
    }

    .start-card,
    .game-card,
    .result-card {
      padding: 18px 16px;
      border: 4px solid #fff;
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      box-shadow:
        0 12px 0 rgba(255,183,77,.35),
        0 18px 35px rgba(0,0,0,.12);
    }

    .start-card {
      min-height: 76vh;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border: 4px solid #87ddff;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 10px 0 rgba(25,118,210,.18);
      transition: transform .18s ease;
    }

    .logo-link:hover {
      transform: translateY(-4px);
    }

    .logo-link img {
      max-width: min(310px, 74vw);
      max-height: 150px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      color: #ff7a00;
      font-size: clamp(28px, 4.6vw, 48px);
      line-height: 1.22;
      letter-spacing: .06em;
      text-shadow: 3px 3px 0 #fff1a8;
    }

    .start-title {
      color: #1976d2;
      font-size: clamp(36px, 7vw, 66px);
    }

    .lead {
      margin: 4px 0 0;
      color: #475569;
      font-size: clamp(14px, 2.1vw, 18px);
      font-weight: 900;
      line-height: 1.7;
    }

    .mode-select {
      width: min(900px, 96%);
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .mode-btn {
      min-height: 175px;
      padding: 22px 14px;
      border: none;
      border-radius: 24px;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,.18);
      transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
    }

    .mode-btn:hover {
      filter: brightness(1.05);
    }

    .mode-btn:active {
      transform: translateY(5px);
      box-shadow: none;
    }

    .mode-btn strong {
      display: block;
      margin-bottom: 10px;
      font-size: clamp(21px, 2.8vw, 30px);
      line-height: 1.35;
    }

    .mode-btn span {
      display: block;
      font-size: 14px;
      line-height: 1.55;
    }

    .mode-name-individual {
      background: linear-gradient(180deg, #ffbd64, #ff7a00);
    }

    .mode-name-group {
      background: linear-gradient(180deg, #dc8cff, #8b3fd6);
    }

    .mode-flag {
      background: linear-gradient(180deg, #8bd3ff, #1976d2);
    }

    .badge-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 3px solid #87ddff;
      border-radius: 999px;
      color: #1976d2;
      background: #fff;
      font-weight: 900;
    }

    .game-card {
      position: relative;
      margin-top: 16px;
      overflow: hidden;
    }

    .game-card::before {
      content: "★";
      position: absolute;
      top: 14px;
      left: 18px;
      color: #ffd54f;
      font-size: 34px;
      transform: rotate(-14deg);
    }

    .game-card::after {
      content: "●";
      position: absolute;
      top: 18px;
      right: 22px;
      color: #81d4fa;
      font-size: 30px;
    }

    .top-info {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin: 12px 0 14px;
    }

    .info-pill {
      padding: 8px 12px;
      border: 3px solid #ffd54f;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 4px 0 rgba(255,193,7,.26);
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 900;
    }

    .question-mode-pill {
      color: #7b3fe4;
      border-color: #c4a8ff;
      box-shadow: 0 5px 0 rgba(126,87,194,.2);
    }

    .play-layout {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px;
      gap: 14px;
      align-items: start;
    }

    .stage-wrap {
      min-height: 470px;
      padding: 14px;
      border: 4px solid #fff;
      border-radius: 28px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 15px 28px rgba(0,0,0,.12);
    }

    .stage {
      position: relative;
      min-height: 440px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,.9) 0 6px, transparent 7px),
        radial-gradient(circle at 82% 22%, rgba(255,255,255,.9) 0 8px, transparent 9px),
        radial-gradient(circle at 28% 80%, rgba(255,255,255,.75) 0 10px, transparent 11px),
        linear-gradient(180deg, #e8fbff, #fff6d6);
    }

    .big-question {
      margin: 0;
      color: #7b3fe4;
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 900;
      line-height: 1.35;
      text-shadow: 2px 2px 0 #fff;
    }

    .flag-frame {
      width: min(620px, 94%);
      min-height: 260px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 5px solid #fff;
      border-radius: 26px;
      background: linear-gradient(
        45deg,
        rgba(255,255,255,.65),
        rgba(255,255,255,.95)
      );
      box-shadow:
        0 10px 0 rgba(25,118,210,.16),
        0 18px 28px rgba(0,0,0,.14);
    }

    .main-flag {
      max-width: 100%;
      max-height: 310px;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.18));
    }

    .country-name-display {
      min-height: 110px;
      padding: 18px 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 5px solid #ffd54f;
      border-radius: 28px;
      color: #1976d2;
      background: #fff;
      box-shadow:
        0 10px 0 rgba(255,193,7,.25),
        0 18px 28px rgba(0,0,0,.12);
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 2px 2px 0 #fff1a8;
    }

    .answer-grid {
      width: min(760px, 98%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .answer-btn {
      min-height: 64px;
      padding: 10px;
      border: 4px solid #fff;
      border-radius: 22px;
      color: #263044;
      background: linear-gradient(180deg, #fff, #fff3c4);
      box-shadow: 0 7px 0 rgba(255,122,0,.25);
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 900;
      cursor: pointer;
      transition:
        transform .12s ease,
        box-shadow .12s ease,
        filter .12s ease;
    }

    .answer-btn:hover {
      filter: brightness(1.04);
    }

    .answer-btn:active {
      transform: translateY(5px);
      box-shadow: none;
    }

    .flag-choice {
      position: relative;
      min-height: 170px;
      padding: 10px;
      border: 4px solid #fff;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, #fff, #e9f8ff);
      box-shadow: 0 7px 0 rgba(25,118,210,.18);
      cursor: pointer;
      transition:
        transform .12s ease,
        box-shadow .12s ease,
        filter .12s ease;
    }

    .flag-choice:hover {
      filter: brightness(1.04);
    }

    .flag-choice:active {
      transform: translateY(5px);
      box-shadow: none;
    }

    .flag-choice img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      border-radius: 10px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.16));
    }

    .choice-number {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ffb74d;
      border-radius: 999px;
      color: #ff7a00;
      background: #fff1a8;
      font-size: 20px;
      font-weight: 900;
    }

    .correct {
      border-color: #22c55e !important;
      background: linear-gradient(180deg, #d9ffe5, #64d989) !important;
    }

    .wrong {
      border-color: #ef4444 !important;
      background: linear-gradient(180deg, #ffe2e2, #ff8a8a) !important;
    }

    .control-panel {
      position: sticky;
      top: 16px;
      padding: 12px;
      border: 4px solid #fff;
      border-radius: 24px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 12px 24px rgba(0,0,0,.1);
    }

    .message {
      min-height: 86px;
      margin-bottom: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #f5b7ff;
      border-radius: 18px;
      color: #b000bd;
      background: #fff;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.5;
    }

    /* ヒント表示 */
    .hint-box {
      min-height: 68px;
      margin-bottom: 12px;
      padding: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 3px solid #ffd54f;
      border-radius: 18px;
      color: #9a5a00;
      background: #fff9db;
      font-weight: 900;
      line-height: 1.6;
    }

    .hint-box.show {
      display: flex;
    }

    .hint-content {
      width: 100%;
    }

    .hint-title {
      font-size: 16px;
      margin-bottom: 5px;
      color: #a65a00;
    }

    .hint-region {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .hint-first {
      font-size: 15px;
      color: #6f29a6;
    }

    .hint-first strong {
      display: inline-block;
      margin-left: 3px;
      font-size: 28px;
      color: #7b3fe4;
      vertical-align: middle;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px 10px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .btn-hint {
      color: #6b3d00;
      background: linear-gradient(180deg, #fff59d, #fbbf24);
      box-shadow: 0 7px 0 #d97706;
    }

    .btn-reveal {
      padding: 17px 10px;
      border: 4px solid #f2d7ff;
      color: #fff;
      background: linear-gradient(180deg, #d78cff, #8b3fd6);
      box-shadow: 0 8px 0 #6428a0;
      font-size: 20px;
      animation: pulseReveal 1.6s infinite;
    }

    @keyframes pulseReveal {
      0% {
        transform: scale(1);
        box-shadow: 0 8px 0 #6428a0, 0 0 0 rgba(139,63,214,0);
      }

      50% {
        transform: scale(1.03);
        box-shadow: 0 8px 0 #6428a0, 0 0 22px rgba(139,63,214,.4);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 8px 0 #6428a0, 0 0 0 rgba(139,63,214,0);
      }
    }

    .btn-reset {
      color: #07522b;
      background: linear-gradient(180deg, #a7f3d0, #22c55e);
      box-shadow: 0 7px 0 #14823d;
    }

    .btn-home {
      color: #233044;
      background: linear-gradient(180deg, #e2e8f0, #94a3b8);
      box-shadow: 0 7px 0 #64748b;
    }

    .btn-main {
      padding: 16px 12px;
      border: 4px solid #fff3b0;
      color: #fff;
      background: linear-gradient(180deg, #ffd54f, #ff7a00);
      box-shadow: 0 8px 0 #c95b00;
      font-size: 20px;
    }

    /* みんなで学習用の正解ポップアップ */
    .answer-popup {
      position: absolute;
      left: 50%;
      top: 53%;
      z-index: 100;
      width: min(560px, 88%);
      padding: 22px 18px;
      border: 6px solid #b569e6;
      border-radius: 30px;
      background: rgba(255,255,255,.97);
      box-shadow:
        0 12px 0 rgba(139,63,214,.24),
        0 24px 42px rgba(0,0,0,.28);
      transform: translate(-50%, -50%);
      text-align: center;
      animation: answerPopup .28s ease;
    }

    .answer-popup::before {
      content: "";
      position: absolute;
      inset: -20px;
      z-index: -1;
      border-radius: 38px;
      background: rgba(255,255,255,.3);
      backdrop-filter: blur(2px);
    }

    .answer-popup-label {
      margin-bottom: 6px;
      color: #b000bd;
      font-size: clamp(17px, 2.4vw, 22px);
      font-weight: 900;
    }

    .answer-popup-country {
      color: #6f29a6;
      font-size: clamp(42px, 8vw, 76px);
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 3px 3px 0 #f3ddff;
    }

    .answer-popup-region {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      border: 3px solid #ffd54f;
      border-radius: 999px;
      color: #8c5400;
      background: #fff9d6;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 900;
    }

    @keyframes answerPopup {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.65);
      }

      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .judge-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(255,255,255,.18);
    }

    .judge-mark {
      min-width: 250px;
      padding: 26px 34px;
      border: 6px solid #fff;
      border-radius: 42px;
      background: rgba(255,255,255,.96);
      box-shadow:
        0 14px 0 rgba(0,0,0,.12),
        0 22px 36px rgba(0,0,0,.18);
      font-size: clamp(54px, 12vw, 110px);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      animation: judgePop .35s ease;
    }

    .judge-mark.correct-text {
      color: #16a34a;
    }

    .judge-mark.wrong-text {
      color: #ef4444;
    }

    @keyframes judgePop {
      0% {
        opacity: 0;
        transform: scale(.55) rotate(-8deg);
      }

      65% {
        opacity: 1;
        transform: scale(1.12) rotate(3deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .confetti-piece {
      position: fixed;
      top: -24px;
      z-index: 9999;
      width: 11px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      animation: fall 1.35s linear forwards;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }

      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(720deg);
      }
    }

    .result-card {
      min-height: 62vh;
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .result-title {
      margin: 0;
      color: #ff7a00;
      font-size: clamp(36px, 7vw, 64px);
      text-shadow: 3px 3px 0 #fff1a8;
    }

    .result-text {
      margin: 0;
      color: #263044;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 900;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .mode-select {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mode-flag {
        grid-column: 1 / -1;
        width: 50%;
        min-width: 260px;
        justify-self: center;
      }

      .play-layout {
        grid-template-columns: minmax(0, 1fr) 205px;
      }

      .btn {
        padding: 10px 8px;
        font-size: 14px;
      }

      .stage-wrap {
        min-height: 430px;
      }

      .stage {
        min-height: 400px;
      }

      .flag-frame {
        min-height: 230px;
      }

      .main-flag {
        max-height: 260px;
      }
    }

    @media (max-width: 720px) {
      .mode-select {
        grid-template-columns: 1fr;
      }

      .mode-flag {
        grid-column: auto;
        width: auto;
        min-width: 0;
      }

      .mode-btn {
        min-height: 135px;
      }

      .top-info {
        grid-template-columns: 1fr;
      }

      .play-layout {
        grid-template-columns: 1fr;
      }

      .control-panel {
        position: static;
      }

      .stage-wrap {
        min-height: auto;
      }

      .stage {
        min-height: 520px;
        padding: 14px;
      }

      .answer-grid {
        grid-template-columns: 1fr;
      }

      .flag-choice {
        min-height: 145px;
      }

      .flag-choice img {
        height: 118px;
      }

      .country-name-display {
        min-height: 92px;
        font-size: clamp(32px, 10vw, 56px);
      }

      .flag-frame {
        width: 98%;
        min-height: 220px;
      }

      .main-flag {
        max-height: 250px;
      }

      .answer-popup {
        top: 48%;
        width: 92%;
        padding: 18px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="judge-overlay" id="judgeOverlay">
    <div class="judge-mark" id="judgeMark"></div>
  </div>

  <section class="screen" id="startScreen">
    <div class="start-card">
      <a
        class="logo-link"
        href="https://manabiya-tsubame.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="まなびやつばめ公式サイトへ"
      >
        <img src="rogo.png" alt="まなびやつばめ" />
      </a>

      <h1 class="start-title">国旗と国名クイズ</h1>

      <p class="lead">
        国旗を見て国名を答えたり、<br>
        国名を見て正しい国旗を選んだりして、<br>
        世界の国を楽しく覚えよう！
      </p>

      <div class="mode-select">
        <button
          type="button"
          class="mode-btn mode-name-individual"
          id="startNameIndividualBtn"
        >
          <strong>国名を答える<br>（個別学習用）</strong>
          <span>
            国旗の画像を見て、<br>
            4つの国名から答えを選びます
          </span>
        </button>

        <button
          type="button"
          class="mode-btn mode-name-group"
          id="startNameGroupBtn"
        >
          <strong>国名を答える<br>（みんなで学習用）</strong>
          <span>
            みんなで考えてから、<br>
            「正解を見る」を押します
          </span>
        </button>

        <button
          type="button"
          class="mode-btn mode-flag"
          id="startFlagQuizBtn"
        >
          <strong>国旗を選ぶ</strong>
          <span>
            国名を見て、<br>
            正しい国旗を4つから選びます
          </span>
        </button>
      </div>

      <div class="badge-row">
        <span class="badge">世界の国</span>
        <span class="badge">国旗の形</span>
        <span class="badge">地域の学習</span>
      </div>
    </div>
  </section>

  <main class="screen hidden" id="gameScreen">
    <section class="game-card">
      <h1>どこの国かな？</h1>

      <p class="lead" id="gameLead">
        よく見て、考えて、答えてみよう！ヒントも使えます。
      </p>

      <div class="top-info">
        <div class="info-pill" id="questionNumber">
          第1問 / 51問
        </div>

        <div class="info-pill question-mode-pill" id="modeLabel">
          国旗を見て国名を答えよう
        </div>

        <div class="info-pill" id="scoreText">
          正解：0問
        </div>
      </div>

      <div class="play-layout">
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <p class="big-question" id="questionText">
              この国旗はどこの国？
            </p>

            <div id="mainDisplay"></div>

            <div class="answer-grid" id="answerGrid"></div>

            <div
              class="answer-popup hidden"
              id="answerPopup"
              aria-live="polite"
            >
              <div class="answer-popup-label">
                正解は……
              </div>

              <div
                class="answer-popup-country"
                id="popupCountry"
              ></div>

              <div
                class="answer-popup-region"
                id="popupRegion"
              ></div>
            </div>
          </div>
        </div>

        <aside class="control-panel">
          <div class="message" id="message">
            まずはじっくり見て考えてみよう！
          </div>

          <div class="hint-box" id="hintBox"></div>

          <div class="btn-row">
            <button
              type="button"
              class="btn btn-hint"
              id="hintBtn"
            >
              ヒントを見る
            </button>

            <button
              type="button"
              class="btn btn-reveal hidden"
              id="showAnswerBtn"
            >
              正解を見る
            </button>

            <button
              type="button"
              class="btn btn-reset"
              id="restartBtn"
            >
              最初から
            </button>

            <button
              type="button"
              class="btn btn-home"
              id="homeBtn"
            >
              スタート画面へ
            </button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <section class="screen hidden" id="resultScreen">
    <div class="result-card">
      <h1 class="result-title">おつかれさま！</h1>

      <p class="result-text" id="resultText">
        全部の問題が終わりました。
      </p>

      <button
        type="button"
        class="btn btn-main"
        id="resultRestartBtn"
      >
        もう一回あそぶ
      </button>

      <button
        type="button"
        class="btn btn-home"
        id="resultHomeBtn"
      >
        スタート画面へ
      </button>
    </div>
  </section>

      { name: "アルゼンチン", region: "南アメリカ", image: "argentina.jpg", group: "blue-white" },
      { name: "オーストラリア", region: "オセアニア", image: "australia.jpg", group: "union-jack-blue" },

      { name: "ベルギー", region: "ヨーロッパ", image: "belgium.jpg", group: "vertical-tricolor" },
      { name: "ブラジル", region: "南アメリカ", image: "brazil.jpg", group: "green-yellow" },

      { name: "デンマーク", region: "ヨーロッパ", image: "denmark.jpg", group: "nordic-cross" },

      { name: "フィンランド", region: "ヨーロッパ", image: "finland.jpg", group: "nordic-cross" },

      { name: "ドイツ", region: "ヨーロッパ", image: "germany.jpg", group: "horizontal-tricolor" },

      { name: "インド", region: "アジア", image: "india.jpg", group: "horizontal-tricolor" },

      { name: "ケニア", region: "アフリカ", image: "kenya.jpg", group: "black-red-green" },

      { name: "メキシコ", region: "北アメリカ", image: "mexico.jpg", group: "vertical-tricolor" },
      { name: "モナコ", region: "ヨーロッパ", image: "monaco.jpg", group: "red-white-horizontal" },

      { name: "ノルウェー", region: "ヨーロッパ", image: "norway.jpg", group: "nordic-cross" },

      { name: "ペルー", region: "南アメリカ", image: "peru.jpg", group: "red-white" },
      { name: "フィリピン", region: "アジア", image: "philippines.jpg", group: "stars-stripes" },
      { name: "ポーランド", region: "ヨーロッパ", image: "poland.jpg", group: "red-white-horizontal" },
      { name: "ポルトガル", region: "ヨーロッパ", image: "portugal.jpg", group: "green-red" },
      { name: "ロシア", region: "ヨーロッパ・アジア", image: "russia.jpg", group: "horizontal-tricolor" },
      { name: "スコットランド", region: "ヨーロッパ", image: "scotland.jpg", group: "blue-white-cross" },
      { name: "シンガポール", region: "アジア", image: "singapore.jpg", group: "red-white-horizontal" },
      { name: "韓国", region: "アジア", image: "south korea.jpg", group: "red-blue-circle" },
      { name: "スペイン", region: "ヨーロッパ", image: "spain.jpg", group: "red-yellow" },
      { name: "スウェーデン", region: "ヨーロッパ", image: "sweden.jpg", group: "nordic-cross" },
      { name: "スイス", region: "ヨーロッパ", image: "switzerland.jpg", group: "red-white-cross" },
      { name: "台湾", region: "アジア", image: "taiwan.jpg", group: "red-blue-white" },
      { name: "タイ", region: "アジア", image: "thailand.jpg", group: "red-white-blue-horizontal" },
      { name: "バチカン", region: "ヨーロッパ", image: "vatican.jpg", group: "yellow-white" },
      { name: "ベトナム", region: "アジア", image: "vietnam.jpg", group: "red-star" }
    ];

    const QUESTION_COUNT = COUNTRIES.length;

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");

    const startNameIndividualBtn =
      document.getElementById("startNameIndividualBtn");

    const startNameGroupBtn =
      document.getElementById("startNameGroupBtn");

    const startFlagQuizBtn =
      document.getElementById("startFlagQuizBtn");

    const gameLead = document.getElementById("gameLead");
    const questionNumber = document.getElementById("questionNumber");
    const modeLabel = document.getElementById("modeLabel");
    const scoreText = document.getElementById("scoreText");
    const questionText = document.getElementById("questionText");
    const mainDisplay = document.getElementById("mainDisplay");
    const answerGrid = document.getElementById("answerGrid");

    const answerPopup = document.getElementById("answerPopup");
    const popupCountry = document.getElementById("popupCountry");
    const popupRegion = document.getElementById("popupRegion");

    const message = document.getElementById("message");
    const hintBox = document.getElementById("hintBox");
    const hintBtn = document.getElementById("hintBtn");
    const showAnswerBtn = document.getElementById("showAnswerBtn");
    const restartBtn = document.getElementById("restartBtn");
    const homeBtn = document.getElementById("homeBtn");

    const resultText = document.getElementById("resultText");
    const resultRestartBtn = document.getElementById("resultRestartBtn");
    const resultHomeBtn = document.getElementById("resultHomeBtn");

    const judgeOverlay = document.getElementById("judgeOverlay");
    const judgeMark = document.getElementById("judgeMark");

    let quizMode = "nameIndividual";
    let deck = [];
    let currentIndex = 0;
    let correctCount = 0;
    let currentCountry = null;
    let answerLocked = false;
    let autoTimer = null;

    function showScreen(name) {
      startScreen.classList.add("hidden");
      gameScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");

      if (name === "start") {
        startScreen.classList.remove("hidden");
      }

      if (name === "game") {
        gameScreen.classList.remove("hidden");
      }

      if (name === "result") {
        resultScreen.classList.remove("hidden");
      }
    }

    function shuffleArray(array) {
      const copied = [...array];

      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [copied[i], copied[j]] =
          [copied[j], copied[i]];
      }

      return copied;
    }

    function clearAutoTimer() {
      if (autoTimer) {
        clearTimeout(autoTimer);
        autoTimer = null;
      }
    }

    function hideAnswerPopup() {
      answerPopup.classList.add("hidden");
      popupCountry.textContent = "";
      popupRegion.textContent = "";
    }

    function startGame(mode) {
      clearAutoTimer();
      hideJudge();
      hideAnswerPopup();

      quizMode = mode;

      // 51問を重複なしのランダム順で出題
      deck = shuffleArray(COUNTRIES);

      currentIndex = 0;
      correctCount = 0;
      answerLocked = false;

      showScreen("game");
      createQuestion();
    }

    function createQuestion() {
      clearAutoTimer();
      hideJudge();
      hideAnswerPopup();

      if (currentIndex >= deck.length) {
        showResult();
        return;
      }

      currentCountry = deck[currentIndex];
      answerLocked = false;

      hintBox.classList.remove("show");
      hintBox.textContent = "";

      answerGrid.innerHTML = "";
      mainDisplay.innerHTML = "";

      showAnswerBtn.disabled = false;

      questionNumber.textContent =
        `第${currentIndex + 1}問 / ${QUESTION_COUNT}問`;

      if (quizMode === "nameIndividual") {
        modeLabel.textContent =
          "国名を答える・個別学習用";

        gameLead.textContent =
          "国旗をよく見て、正しい国名を4つから選ぼう！";

        questionText.textContent =
          "この国旗はどこの国？";

        scoreText.style.display = "block";
        scoreText.textContent =
          `正解：${correctCount}問`;

        showAnswerBtn.classList.add("hidden");

        mainDisplay.innerHTML = `
          <div class="flag-frame">
            <img
              class="main-flag"
              src="${currentCountry.image}"
              alt="${currentCountry.name}の国旗"
            >
          </div>
        `;

        makeNameChoices(currentCountry);

        message.textContent =
          "まずはじっくり見て考えてみよう！";
      }

      if (quizMode === "nameGroup") {
        modeLabel.textContent =
          "国名を答える・みんなで学習用";

        gameLead.textContent =
          "みんなで国名を考えてから、正解を確認しよう！";

        questionText.textContent =
          "この国旗はどこの国？";

        scoreText.style.display = "none";
        showAnswerBtn.classList.remove("hidden");

        mainDisplay.innerHTML = `
          <div class="flag-frame">
            <img
              class="main-flag"
              src="${currentCountry.image}"
              alt="国名を考えるための国旗"
            >
          </div>
        `;

        message.innerHTML =
          "みんなで国名を考えてみよう！<br>答えが決まったら「正解を見る」を押してください。";
      }

      if (quizMode === "flag") {
        modeLabel.textContent =
          "国旗を選ぶ";

        gameLead.textContent =
          "国名を見て、正しい国旗を4つから選ぼう！";

        questionText.textContent =
          "この国の国旗はどれ？";

        scoreText.style.display = "block";
        scoreText.textContent =
          `正解：${correctCount}問`;

        showAnswerBtn.classList.add("hidden");

        mainDisplay.innerHTML = `
          <div class="country-name-display">
            ${currentCountry.name}
          </div>
        `;

        makeFlagChoices(currentCountry);

        message.textContent =
          "4つの国旗をよく見比べてみよう！";
      }
    }

    function makeNameChoices(correctCountry) {
      const choices =
        makeSimilarChoices(correctCountry, 3);

      choices.forEach(country => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "answer-btn";
        button.textContent = country.name;

        button.addEventListener("click", () => {
          checkAnswer(
            button,
            country,
            correctCountry
          );
        });

        answerGrid.appendChild(button);
      });
    }

    function makeFlagChoices(correctCountry) {
      const choices =
        makeSimilarChoices(correctCountry, 3);

      choices.forEach((country, index) => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "flag-choice";
        button.setAttribute(
          "aria-label",
          country.name
        );

        button.innerHTML = `
          <div class="choice-number">
            ${index + 1}
          </div>

          <img
            src="${country.image}"
            alt="${country.name}の国旗"
          >
        `;

        button.addEventListener("click", () => {
          checkAnswer(
            button,
            country,
            correctCountry
          );
        });

        answerGrid.appendChild(button);
      });
    }

    function makeSimilarChoices(
      correctCountry,
      wrongCount
    ) {
      let wrongs = COUNTRIES.filter(country =>
        country.name !== correctCountry.name &&
        country.group === correctCountry.group
      );

      if (wrongs.length < wrongCount) {
        const sameRegion = COUNTRIES.filter(country =>
          country.name !== correctCountry.name &&
          country.region === correctCountry.region &&
          !wrongs.some(
            wrong => wrong.name === country.name
          )
        );

        wrongs = [
          ...wrongs,
          ...sameRegion
        ];
      }

      if (wrongs.length < wrongCount) {
        const others = COUNTRIES.filter(country =>
          country.name !== correctCountry.name &&
          !wrongs.some(
            wrong => wrong.name === country.name
          )
        );

        wrongs = [
          ...wrongs,
          ...others
        ];
      }

      const selectedWrongs =
        shuffleArray(wrongs).slice(0, wrongCount);

      return shuffleArray([
        correctCountry,
        ...selectedWrongs
      ]);
    }

    function disableAnswerButtons() {
      const buttons =
        answerGrid.querySelectorAll("button");

      buttons.forEach(button => {
        button.disabled = true;
      });
    }

    function checkAnswer(
      button,
      selectedCountry,
      correctCountry
    ) {
      if (answerLocked) return;

      answerLocked = true;
      disableAnswerButtons();

      if (
        selectedCountry.name ===
        correctCountry.name
      ) {
        correctCount++;

        button.classList.add("correct");

        scoreText.textContent =
          `正解：${correctCount}問`;

        message.innerHTML =
          `正解！<br>${correctCountry.name}の国旗です。`;

        showJudge("correct", "◯ 正解！");
        playSound("correct");
        launchConfetti();

        autoTimer = setTimeout(() => {
          currentIndex++;
          createQuestion();
        }, 1200);

        return;
      }

      button.classList.add("wrong");
      markCorrectAnswer(correctCountry);

      message.innerHTML =
        `おしい！<br>正解は「${correctCountry.name}」です。`;

      showJudge("wrong", "×");
      playSound("wrong");

      // 不正解の場合は1秒後に自動進行
      autoTimer = setTimeout(() => {
        currentIndex++;
        createQuestion();
      }, 1000);
    }

    function markCorrectAnswer(correctCountry) {
      if (quizMode === "nameIndividual") {
        const buttons =
          answerGrid.querySelectorAll(".answer-btn");

        buttons.forEach(button => {
          if (
            button.textContent ===
            correctCountry.name
          ) {
            button.classList.add("correct");
          }
        });
      }

      if (quizMode === "flag") {
        const buttons =
          answerGrid.querySelectorAll(".flag-choice");

        buttons.forEach(button => {
          if (
            button.getAttribute("aria-label") ===
            correctCountry.name
          ) {
            button.classList.add("correct");
          }
        });
      }
    }

    function showGroupAnswer() {
      if (
        quizMode !== "nameGroup" ||
        !currentCountry ||
        answerLocked
      ) {
        return;
      }

      answerLocked = true;
      showAnswerBtn.disabled = true;

      popupCountry.textContent =
        currentCountry.name;

      popupRegion.textContent =
        currentCountry.region;

      // 国旗の上に大きく正解を表示
      answerPopup.classList.remove("hidden");

      message.innerHTML =
        `正解は「${currentCountry.name}」です！<br>2秒後に次の問題へ進みます。`;

      playSound("reveal");
      launchConfetti();

      // 正解表示から2秒後に自動進行
      autoTimer = setTimeout(() => {
        hideAnswerPopup();
        currentIndex++;
        createQuestion();
      }, 2000);
    }

    function showResult() {
      clearAutoTimer();
      hideJudge();
      hideAnswerPopup();

      if (quizMode === "nameGroup") {
        resultText.innerHTML = `
          ${QUESTION_COUNT}問すべて終わりました。<br>
          みんなで世界の国旗を<br>
          しっかり考えることができました！
        `;
      } else {
        const rate = Math.round(
          (correctCount / QUESTION_COUNT) * 100
        );

        resultText.innerHTML = `
          ${QUESTION_COUNT}問すべて終わりました。<br>
          正解：${correctCount}問 ／ ${QUESTION_COUNT}問<br>
          正答率：${rate}%<br>
          世界の国旗をよく見られましたね！
        `;
      }

      showScreen("result");
      launchConfetti();
      playSound("finish");
    }

    /*
      ヒント表示

      変更点：
      1. その国の地域を表示
      2. 国名の最初の1文字を表示
    */
    function showHint() {
      if (!currentCountry || answerLocked) {
        return;
      }

      const firstCharacter =
        Array.from(currentCountry.name)[0];

      hintBox.innerHTML = `
        <div class="hint-content">
          <div class="hint-title">
            ★ ヒント ★
          </div>

          <div class="hint-region">
            地域：${currentCountry.region}
          </div>

          <div class="hint-first">
            国名の最初の文字：<strong>${firstCharacter}</strong>
          </div>
        </div>
      `;

      hintBox.classList.add("show");

      playSound("hint");
    }

    function showJudge(type, text) {
      judgeOverlay.style.display = "flex";

      judgeMark.className =
        "judge-mark " +
        (
          type === "correct"
            ? "correct-text"
            : "wrong-text"
        );

      judgeMark.textContent = text;

      judgeMark.style.animation = "none";
      void judgeMark.offsetWidth;
      judgeMark.style.animation = "";
    }

    function hideJudge() {
      judgeOverlay.style.display = "none";
      judgeMark.textContent = "";
    }

    function launchConfetti() {
      const colors = [
        "#ff5c8a",
        "#ffd54f",
        "#4dd0e1",
        "#81c784",
        "#9575cd",
        "#ff8a65"
      ];

      for (let i = 0; i < 38; i++) {
        const piece =
          document.createElement("div");

        piece.className = "confetti-piece";

        piece.style.left =
          Math.random() * 100 + "vw";

        piece.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];

        piece.style.animationDelay =
          Math.random() * .25 + "s";

        piece.style.animationDuration =
          1 + Math.random() * .65 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 1800);
      }
    }

    function playSound(type) {
      try {
        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContext) return;

        const context = new AudioContext();
        const now = context.currentTime;
        const gain = context.createGain();

        gain.connect(context.destination);

        if (type === "correct") {
          const notes = [
            523.25,
            659.25,
            783.99
          ];

          notes.forEach((frequency, index) => {
            const oscillator =
              context.createOscillator();

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
              frequency,
              now + index * .08
            );

            oscillator.connect(gain);

            oscillator.start(
              now + index * .08
            );

            oscillator.stop(
              now + index * .08 + .16
            );
          });

          gain.gain.setValueAtTime(.14, now);

          gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .48
          );

          setTimeout(() => {
            context.close();
          }, 620);

          return;
        }

        if (type === "wrong") {
          const oscillator =
            context.createOscillator();

          oscillator.type = "sawtooth";

          oscillator.frequency.setValueAtTime(
            190,
            now
          );

          oscillator.frequency.exponentialRampToValueAtTime(
            110,
            now + .28
          );

          oscillator.connect(gain);

          gain.gain.setValueAtTime(.13, now);

          gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .32
          );

          oscillator.start(now);
          oscillator.stop(now + .32);

          setTimeout(() => {
            context.close();
          }, 440);

          return;
        }

        if (type === "hint") {
          const oscillator =
            context.createOscillator();

          oscillator.type = "triangle";

          oscillator.frequency.setValueAtTime(
            440,
            now
          );

          oscillator.frequency.exponentialRampToValueAtTime(
            660,
            now + .16
          );

          oscillator.connect(gain);

          gain.gain.setValueAtTime(.09, now);

          gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .25
          );

          oscillator.start(now);
          oscillator.stop(now + .25);

          setTimeout(() => {
            context.close();
          }, 360);

          return;
        }

        if (type === "reveal") {
          const notes = [
            440,
            554.37,
            659.25
          ];

          notes.forEach((frequency, index) => {
            const oscillator =
              context.createOscillator();

            oscillator.type = "triangle";

            oscillator.frequency.setValueAtTime(
              frequency,
              now + index * .09
            );

            oscillator.connect(gain);

            oscillator.start(
              now + index * .09
            );

            oscillator.stop(
              now + index * .09 + .2
            );
          });

          gain.gain.setValueAtTime(.11, now);

          gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .55
          );

          setTimeout(() => {
            context.close();
          }, 680);

          return;
        }

        if (type === "finish") {
          const notes = [
            523.25,
            659.25,
            783.99,
            1046.5
          ];

          notes.forEach((frequency, index) => {
            const oscillator =
              context.createOscillator();

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
              frequency,
              now + index * .1
            );

            oscillator.connect(gain);

            oscillator.start(
              now + index * .1
            );

            oscillator.stop(
              now + index * .1 + .2
            );
          });

          gain.gain.setValueAtTime(.13, now);

          gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .7
          );

          setTimeout(() => {
            context.close();
          }, 820);
        }
      } catch (error) {
        console.warn(
          "効果音を再生できませんでした。",
          error
        );
      }
    }

    function resetGameWithConfirm() {
      const confirmed = window.confirm(
        "本当に最初の問題に戻りますか？"
      );

      if (!confirmed) {
        return;
      }

      startGame(quizMode);
    }

    function goHome() {
      clearAutoTimer();
      hideJudge();
      hideAnswerPopup();
      showScreen("start");
    }

    hintBtn.addEventListener(
      "click",
      showHint
    );

    showAnswerBtn.addEventListener(
      "click",
      showGroupAnswer
    );

    restartBtn.addEventListener(
      "click",
      resetGameWithConfirm
    );

    homeBtn.addEventListener(
      "click",
      goHome
    );

    resultRestartBtn.addEventListener(
      "click",
      () => startGame(quizMode)
    );

    resultHomeBtn.addEventListener(
      "click",
      goHome
    );

    startNameIndividualBtn.addEventListener(
      "click",
      () => startGame("nameIndividual")
    );

    startNameGroupBtn.addEventListener(
      "click",
      () => startGame("nameGroup")
    );

    startFlagQuizBtn.addEventListener(
      "click",
      () => startGame("flag")
    );
  </script>
</body>
